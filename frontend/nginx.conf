# Service du bundle Vite en mode SPA.
#
# Les routes (/verify-email, /reset-password, /confirm-email-change,
# /alerts/unsubscribe…) n'existent que côté React Router : sans repli sur
# index.html, un lien ouvert depuis un email ou une page rechargée hors de
# « / » renvoie un 404 nginx.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # index.html jamais mis en cache : il référence les fichiers hachés du
    # dernier build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fichiers hachés par Vite : contenu immuable pour un nom donné.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
