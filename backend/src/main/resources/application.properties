spring.application.name=backend
spring.profiles.active=local

management.endpoints.web.exposure.include=health,info

# Configuration JWT
jwt.secret=${JWT_SECRET:default_secret_for_dev_only_change_in_production}

# Configuration OpenAgenda (LL-5006) — aucune valeur par défaut sensible :
# collect() échoue explicitement tant que ces variables ne sont pas définies.
openagenda.api-key=${OPENAGENDA_API_KEY:}
openagenda.agenda-uid=${OPENAGENDA_AGENDA_UID:}
openagenda.source-name=${OPENAGENDA_SOURCE_NAME:OpenAgenda}
