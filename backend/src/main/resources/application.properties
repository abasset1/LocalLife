# Le collecteur par défaut utilise openagenda.agenda-uid pour la rétrocompatibilité.

# Clé API OpenAgenda (commune à tous les agendas)
openagenda.api-key=oa_pk_apDyEbJzesQRVtweBegCZnvSzekuTzgklToDXIAdfrDrwHQgMLVDpIiSDtLdZKAh

# Configuration par défaut (rétrocompatibilité LL-5006)
openagenda.agenda-uid=${OPENAGENDA_AGENDA_UID:}
