spring.application.name=backend
spring.profiles.active=local

management.endpoints.web.exposure.include=health,info

# Configuration JWT
jwt.secret=${JWT_SECRET:default_secret_for_dev_only_change_in_production}

# Configuration OpenAgenda (LL-5006, LL-8004) — aucune valeur par défaut sensible :
# collect() échoue explicitement tant que ces variables ne sont pas définies.
# Pour Avignon (LL-8004), plusieurs agendas peuvent être configurés.
# Le collecteur par défaut utilise openagenda.agenda-uid pour la rétrocompatibilité.

# Clé API OpenAgenda (commune à tous les agendas). Externalisée (LL-9004) :
# une valeur avait été committée en dur par erreur, contredisant le
# commentaire ci-dessus. Cette clé est compromise (exposée publiquement
# dans l'historique Git) : à révoquer/régénérer sur le portail
# OpenAgenda, puis à fournir uniquement via la variable d'environnement.
openagenda.api-key=${OPENAGENDA_API_KEY:}

# Configuration par défaut (rétrocompatibilité LL-5006)
openagenda.agenda-uid=86244142
openagenda.source-name=OpenAgenda Ministere culture

# Configuration pour Avignon - Culture (LL-8004)
openagenda.avignon-culture-uid=79839448
openagenda.avignon-culture-name=OpenAgenda Ville d'Avignon
# Configuration pour Avignon - Spectacles (LL-8004)
#openagenda.avignon-spectacles-uid=${OPENAGENDA_AVIGNON_SPECTACLES_UID:}
#openagenda.avignon-spectacles-name=OpenAgenda Avignon Spectacles

# Configuration pour Avignon - Patrimoine (LL-8004)
#openagenda.avignon-patrimoine-uid=${OPENAGENDA_AVIGNON_PATRIMOINE_UID:}
#openagenda.avignon-patrimoine-name=OpenAgenda Avignon Patrimoine

# Configuration pour Avignon - Loisirs (LL-8004)
#openagenda.avignon-loisirs-uid=${OPENAGENDA_AVIGNON_LOISIRS_UID:}
#openagenda.avignon-loisirs-name=OpenAgenda Avignon Loisirs
