spring.application.name=backend
spring.profiles.active=local

management.endpoints.web.exposure.include=health

# Configuration JWT
jwt.secret=${JWT_SECRET:default_secret_for_dev_only_change_in_production}

# Configuration OpenAgenda (LL-5006, LL-8004, LL-EF-005) — aucune valeur
# par défaut sensible : collect() échoue explicitement tant que cette
# variable n'est pas définie.
#
# Depuis LL-EF-005, seule la clé API (secret partagé entre tous les
# agendas d'un même compte) reste ici : l'identifiant de chaque agenda, son
# nom et son filtre région se gèrent désormais depuis l'interface
# d'administration (table `source`, voir OpenAgendaCollectorFactory), pas
# via des propriétés par agenda — l'ancien bloc `openagenda.agenda-uid`/
# `openagenda.avignon-*` (LL-8004) a été retiré au profit de la migration
# V14__add_agenda_fields_to_source.sql.
#
# Clé API OpenAgenda. Externalisée (LL-9004) : une valeur avait été
# committée en dur par erreur, contredisant le commentaire ci-dessus.
# Cette clé est compromise (exposée publiquement dans l'historique Git) :
# à révoquer/régénérer sur le portail OpenAgenda, puis à fournir
# uniquement via la variable d'environnement.
openagenda.api-key=${OPENAGENDA_API_KEY:}

