spring.application.name=backend
spring.profiles.active=local

management.endpoints.web.exposure.include=health

# Configuration JWT
jwt.secret=${JWT_SECRET:default_secret_for_dev_only_change_in_production}

# Configuration OpenAgenda (LL-5006, LL-8004, LL-EF-005) — aucune valeur
# par défaut sensible : collect() échoue explicitement tant que cette
# variable n'est pas définie.
#
# Depuis LL-EF-005, seule la clé API (secret partagé entre tous les
# agendas d'un même compte) reste ici : l'identifiant de chaque agenda, son
# nom et son filtre région se gèrent désormais depuis l'interface
# d'administration (table `source`, voir OpenAgendaCollectorFactory), pas
# via des propriétés par agenda — l'ancien bloc `openagenda.agenda-uid`/
# `openagenda.avignon-*` (LL-8004) a été retiré au profit de la migration
# V14__add_agenda_fields_to_source.sql.
#
# Clé API OpenAgenda. Externalisée (LL-9004) : une valeur avait été
# committée en dur par erreur, contredisant le commentaire ci-dessus.
# Cette clé est compromise (exposée publiquement dans l'historique Git) :
# à révoquer/régénérer sur le portail OpenAgenda, puis à fournir
# uniquement via la variable d'environnement.
openagenda.api-key=${OPENAGENDA_API_KEY:}

# Configuration SMTP (LL-EF-007) — envoi de l'email de réinitialisation de
# mot de passe. Aucun identifiant en dur : fourni uniquement par variable
# d'environnement. Valeurs par défaut adaptées à un serveur SMTP de
# développement local (ex. MailHog/Mailpit sur le port 1025, sans auth/TLS).
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
# Port 465 (connexion chiffrée dès le départ) : SMTP_SSL=true et SMTP_STARTTLS=false.
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
# Délais (ms) : un serveur SMTP muet ne bloque plus une inscription ou un envoi d'alertes.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail-from=${MAIL_FROM:no-reply@locallife.local}

# URL de base du frontend (LL-EF-007), utilisée pour construire le lien de
# réinitialisation de mot de passe envoyé par email.
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Alertes (ActivityAlertNotifier) : envoi du récapitulatif des nouvelles
# activités correspondant aux alertes des utilisateurs (e-mail et/ou push). Expression cron Spring
# (seconde minute heure jour mois jour-semaine), fuseau Europe/Paris.
# Par défaut chaque jour à 8 h.
app.alerts.cron=${ALERTS_CRON:0 0 8 * * *}

# Notifications push des alertes (application mobile), via le service Expo
# Push. EXPO_ACCESS_TOKEN n'est requis que si la « sécurité renforcée des
# notifications » est activée sur le projet Expo. EXPO_PUSH_URL ne sert qu'aux
# tests (serveur local).
app.push.expo-url=${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
app.push.expo-access-token=${EXPO_ACCESS_TOKEN:}

# Configuration Google Sign-In (LL-EF-011) — aucune valeur par défaut
# sensible, même logique que openagenda.api-key ci-dessus : sans cette
# variable, GoogleAuthService démarre (NimbusJwtDecoder ne contacte Google
# qu'à la première vérification d'un token, pas à la construction du
# bean) mais toute tentative de connexion via Google échouera
# explicitement (aucun token Google n'aura jamais cette audience vide
# comme destinataire). Identifiant client OAuth 2.0 obtenu depuis Google
# Cloud Console (type "Application Web"), utilisé pour vérifier que
# chaque ID token reçu a bien été émis pour cette application précise —
# voir GoogleAuthService.
google.client-id=${GOOGLE_CLIENT_ID:}

