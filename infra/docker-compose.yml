services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: locallife-postgres
    environment:
      POSTGRES_DB: locallife
      POSTGRES_USER: locallife
      POSTGRES_PASSWORD: locallife
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
