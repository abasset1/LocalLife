name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: locallife
          POSTGRES_USER: locallife
          POSTGRES_PASSWORD: locallife
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U locallife"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout du code
        uses: actions/checkout@v6

      - name: Configurer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build et tests (mvn verify)
        working-directory: backend
        run: mvn --batch-mode verify
